services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host          # easiest for LAN discovery
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM} # from https://plex.tv/claim (expires ~4 min)
    volumes:
      - ./config:/config
      - ${MEDIA_ROOT}/movies:/movies
      - ${MEDIA_ROOT}/tv:/tv
    # Intel HD 630 Quick Sync HW transcoding (needs the media disk mounted + Plex Pass):
    # devices:
    #   - /dev/dri:/dev/dri
    restart: unless-stopped
